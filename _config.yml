# FILE: _config.yml
#
# Purpose: configuration for the GitHub Pages build. Pages publishes
# this repository through Jekyll (the site's build type is "legacy"),
# and Jekyll reads this file before it touches anything.
#
# Why this file exists: from commit 8396e8c (21 Nov 2026) every Pages
# build failed with "Page build failed", freezing the live site at the
# 21 Nov 2026 05:17 build. The cause was AGENTS.md held as a symlink
# (git mode 120000) to ../vunderland/settings/AGENTS.md - a path that
# exists only on the author's machines, not on GitHub's build
# machines. AGENTS.md is now a regular pointer file to that golden
# master, so the dangling link is gone. The exclude below stays so
# that Jekyll never publishes the pointer, or any future rules file,
# to the public website.
#
# Invariant: keep the AGENTS.md exclude. Repository agent rules are
# for agents, not for visitors of itoldyouso.tech.
exclude:
  - AGENTS.md
