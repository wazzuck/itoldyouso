# ==============================================================================
# Workflow: Submit Updated Pages to IndexNow
# Purpose: Notify Microsoft Bing and IndexNow-participating Artificial
#          Intelligence (AI) search engines whenever GitHub Pages finishes
#          deploying updates to the main branch.
# ==============================================================================

name: Submit Updated Pages to IndexNow

on:
  # 1. Run automatically after GitHub Pages finishes building and publishing
  #    main so the live verification key file and updated HTML exist online.
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

  # 2. Permit manual runs from the GitHub Actions tab or CLI if needed.
  workflow_dispatch:

jobs:
  submit_indexnow:
    # Only notify IndexNow on manual dispatch or successful Pages deployment.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the published main branch containing sitemap.xml and key.
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Ensure Python 3 standard environment is active.
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Run the standard-library IndexNow submission script against
      #    https://api.indexnow.org/indexnow.
      - name: Submit sitemap URLs to IndexNow
        run: python3 scripts/submit_indexnow.py
